name: CI

on:
  push:
    branches: [main]
  pull_request:

# mx-tweak requires Qt6 >= 6.8 (CMakeLists.txt), which is newer than what
# Ubuntu's apt repos ship (6.4.2 as of noble), so Qt is installed via
# aqtinstall here instead of apt. This also means debuild's internal CMake
# configure would hit the same version wall, so there is no
# debian-package-check job for this repo — real packaging validation
# happens via OBS, which has an up-to-date Qt.
jobs:
  build-test:
    name: build-test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.8.2"
          host: linux
          target: desktop
          dir: ${{ runner.temp }}
          setup-python: false

      - name: Install common build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install GCC 14
        if: matrix.compiler == 'gcc'
        run: sudo apt-get install -y gcc-14 g++-14

      - name: Install Clang
        if: matrix.compiler == 'clang'
        run: sudo apt-get install -y clang

      - name: Configure (GCC)
        if: matrix.compiler == 'gcc'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Configure (Clang)
        if: matrix.compiler == 'clang'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      - name: Build
        run: cmake --build build --parallel
